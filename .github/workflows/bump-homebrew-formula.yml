name: Bump Homebrew formula

on:
  release:
    types: [published]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute SHA256
        id: sha
        run: |
          TAG="${{ github.event.release.tag_name }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          # Strip leading 'v' for version field
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update trooper.rb
        run: |
          TAG="${{ steps.sha.outputs.tag }}"
          VERSION="${{ steps.sha.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          URL="${{ steps.sha.outputs.url }}"

          sed -i "s|url \".*\"|url \"${URL}\"|" trooper.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" trooper.rb
          sed -i "s|version \".*\"|version \"${VERSION}\"|" trooper.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trooper.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: bump Homebrew formula to ${{ steps.sha.outputs.tag }}"
          git push
